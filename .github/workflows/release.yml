# Release (docs/release.md, specs/release-cycle.md in the KS-Suite workspace). The checks
# before the build and the publishing after it are ks-utility's shared Tauri release
# workflows (called at @main, ks-utility's newest release); the build jobs
# in between are this app's own. Two ways in:
#
#   Tag push       vX.Y.Z releases every platform: the macOS disk images, the Windows beta
#                  installer and the Chrome extension. mac-vX.Y.Z, windows-vX.Y.Z or
#                  chrome-vX.Y.Z releases that platform only. The tag must be on main and
#                  higher than the tags before it; CHANGELOG.md needs a dated section for it
#                  ("## [0.2.0] - …", or "## [macOS 0.2.1] - …" for a platform tag). Every file
#                  is attested and the GitHub release is PUBLISHED, only after every build and
#                  check passed. No draft. A failure anywhere publishes nothing.
#
#   Manual run     On any branch, e.g. dev, with the version and platform to rehearse: the DEV
#   (rehearsal,    build. Every job runs as for a tag, except "the tag is on main", but builds the
#    DEV build)    DEV variant (tauri.dev.conf.json, the DEV extension; files named
#                  ks-download-manager-dev-…), which installs next to the production app. Nothing
#                  is attested and nothing is ever published; the files and the notes stay as
#                  workflow artifacts for the owner to test by hand.
#
# Our own environment variables start with KSDM_: tools read some plain names by
# themselves (zip reads $KSDM_EXT_ZIP as options, make imports every variable).
# Runner images are named versions, never -latest (docs/decisions-release.md).
# Actions are GitHub's own, pinned to a full commit SHA (version in the comment).
name: Release

on:
  push:
    tags: ["v*", "mac-v*", "windows-v*", "chrome-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, X.Y.Z (CHANGELOG.md needs a dated section for it). Builds everything, releases nothing."
        required: true
        type: string
      platform:
        description: "Platform to rehearse, as its tag would: all (vX.Y.Z) or one platform (mac-vX.Y.Z, …)."
        type: choice
        options: [all, mac, windows, chrome]
        default: all

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: kumasumit/ks-utility/.github/workflows/tauri-app-release-check.yml@main
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}
      platform: ${{ inputs.platform || 'all' }}
      platforms: "mac windows chrome"
      set-version: node shared/scripts/set-version.mjs "$KS_TAG"

  # What this release builds and attaches: exactly these files, by name.
  plan:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      files: ${{ steps.p.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: p
        env:
          KSDM_VERSION: ${{ needs.check.outputs.version }}
          KSDM_PLATFORM: ${{ needs.check.outputs.platform }}
          KSDM_NAME: ${{ needs.check.outputs.rehearsal == 'true' && 'ks-download-manager-dev' || 'ks-download-manager' }}
        run: |
          P="$KSDM_NAME-v$KSDM_VERSION"
          SRC=$(basename "$(jq -r .ffmpeg.source shared/src-tauri/sidecars.json)")
          f=""
          case "$KSDM_PLATFORM" in all|mac) f="$f $P-macos-arm64.dmg $P-macos-x64.dmg" ;; esac
          case "$KSDM_PLATFORM" in all|windows) f="$f $P-windows-x64-setup-beta.exe" ;; esac
          case "$KSDM_PLATFORM" in all|chrome) f="$f $KSDM_NAME-extension-v$KSDM_VERSION.zip" ;; esac
          # The LGPL source of the bundled ffmpeg goes with every release that bundles it.
          case "$KSDM_PLATFORM" in all|mac|windows) f="$f $SRC" ;; esac
          echo "files=${f# }" >> "$GITHUB_OUTPUT"
          echo "files:${f}"

  # The ffmpeg source the bundled ffmpeg is built from: from the pinned URL, hash-checked.
  ffmpeg-source:
    needs: check
    if: contains(fromJSON('["all","mac","windows"]'), needs.check.outputs.platform)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          SRC=$(jq -r .ffmpeg.source shared/src-tauri/sidecars.json)
          SHA=$(jq -r .ffmpeg.sha256 shared/src-tauri/sidecars.json)
          mkdir -p out
          curl -fsSL -o "out/$(basename "$SRC")" "$SRC"
          echo "$SHA  out/$(basename "$SRC")" | sha256sum -c -
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-source
          path: out/
          if-no-files-found: error

  mac:
    needs: check
    if: contains(fromJSON('["all","mac"]'), needs.check.outputs.platform)
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            arch: arm64
          - triple: x86_64-apple-darwin
            arch: x64
    runs-on: macos-15
    permissions:
      contents: read
    # The Tauri project lives in shared/ (CLAUDE.md, "Platform folders").
    defaults:
      run:
        working-directory: shared
    env:
      KSDM_TAG: ${{ needs.check.outputs.tag }}
      KSDM_VERSION: ${{ needs.check.outputs.version }}
      KSDM_APP: src-tauri/target/${{ matrix.triple }}/release/bundle/macos/KS Download Manager${{ needs.check.outputs.rehearsal == 'true' && ' DEV' || '' }}.app
      KSDM_DMG: ${{ needs.check.outputs.rehearsal == 'true' && 'ks-download-manager-dev' || 'ks-download-manager' }}-v${{ needs.check.outputs.version }}-macos-${{ matrix.arch }}.dmg
      # The DEV build (a rehearsal) adds the DEV overlay: its own identifier, name and icon.
      KSDM_CONFIG: ${{ needs.check.outputs.rehearsal == 'true' && '--config src-tauri/tauri.dev.conf.json' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - run: node scripts/set-version.mjs "$KSDM_TAG"
      - name: Signing mode (Developer ID only when every Apple secret is set)
        id: mode
        env:
          C: ${{ secrets.APPLE_CERTIFICATE }}
          P: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          I: ${{ secrets.APPLE_ID }}
          W: ${{ secrets.APPLE_PASSWORD }}
          T: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          n=0
          for v in "$C" "$P" "$S" "$I" "$W" "$T"; do [ -n "$v" ] && n=$((n + 1)); done
          case $n in
            6) echo "mode=developer-id" >> "$GITHUB_OUTPUT" ;;
            0) echo "mode=ad-hoc" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Only $n of the 6 Apple secrets are set. Set all six (Developer ID) or none (ad hoc); see docs/release.md."; exit 1 ;;
          esac
      - name: Rust target
        run: rustup target add ${{ matrix.triple }}
      - name: Cache bundled programs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: shared/src-tauri/binaries
          key: sidecars-${{ matrix.triple }}-${{ hashFiles('shared/src-tauri/sidecars.json', 'shared/scripts/build-ffmpeg.sh', 'shared/scripts/sidecars.mjs', 'shared/scripts/deno-notices.mjs') }}
      - run: npm ci
      - name: Bundled programs (hash-checked; ffmpeg built from source)
        run: node scripts/sidecars.mjs ${{ matrix.triple }}
      # No Apple secrets in this step's environment: Tauri would otherwise sign and notarise
      # by itself, before scripts/sign-macos.sh re-signs the bundled programs.
      - name: Build the app
        run: npm run tauri build -- --target ${{ matrix.triple }} --bundles app $KSDM_CONFIG
      - name: Licence files are in the app
        run: |
          L="$KSDM_APP/Contents/Resources/licenses"
          for f in yt-dlp-LICENSE.txt ffmpeg-COPYING.LGPLv2.1 ffmpeg-LICENSE.md ffmpeg-SOURCE.txt deno-LICENSE.md deno-THIRD-PARTY.txt; do
            [ -s "$L/$f" ] || { echo "::error::missing licence file: $f"; exit 1; }
          done
          [ -s "$KSDM_APP/Contents/Resources/yt-dlp/_internal/THIRD_PARTY_LICENSES.txt" ] || { echo "::error::missing yt-dlp THIRD_PARTY_LICENSES.txt"; exit 1; }
          grep -q "Standard licence texts" "$L/deno-THIRD-PARTY.txt" || { echo "::error::deno notices without the standard licence texts"; exit 1; }
      - name: Bundled programs run
        run: |
          M="$KSDM_APP/Contents/MacOS"
          run() { if [ "${{ matrix.arch }}" = x64 ]; then arch -x86_64 "$@"; else "$@"; fi; }
          if [ "${{ matrix.arch }}" = x64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::Rosetta is not available on this runner: the x86_64 programs were not run (hand check)."
            exit 0
          fi
          run "$M/ffmpeg" -hide_banner -version | head -1
          run "$M/ffprobe" -hide_banner -version | head -1
          run "$M/deno" --version | head -1
          run "$KSDM_APP/Contents/Resources/yt-dlp/yt-dlp_macos" --version
      - name: Import the Developer ID certificate
        if: steps.mode.outputs.mode == 'developer-id'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/release.keychain-db"
          KP=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Sign, notarise and staple the app (Developer ID)
        if: steps.mode.outputs.mode == 'developer-id'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sh scripts/sign-macos.sh "$KSDM_APP" "$APPLE_SIGNING_IDENTITY"
          sh scripts/notarize-macos.sh "$KSDM_APP"
      - name: Sign the app (ad hoc)
        if: steps.mode.outputs.mode == 'ad-hoc'
        run: sh scripts/sign-macos.sh "$KSDM_APP" -
      - name: Make the disk image
        run: |
          mkdir -p release
          sh scripts/make-dmg.sh "$KSDM_APP" "release/$KSDM_DMG"
      - name: Sign, notarise and staple the disk image (Developer ID)
        if: steps.mode.outputs.mode == 'developer-id'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "release/$KSDM_DMG"
          sh scripts/notarize-macos.sh "release/$KSDM_DMG"
          spctl -a -t open --context context:primary-signature -vv "release/$KSDM_DMG"
      - name: Remove the temporary keychain
        if: always() && steps.mode.outputs.mode == 'developer-id'
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
      - run: echo "${{ steps.mode.outputs.mode }}" > release/signing-macos-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-${{ matrix.arch }}
          path: shared/release/
          if-no-files-found: error

  extension:
    needs: check
    if: contains(fromJSON('["all","chrome"]'), needs.check.outputs.platform)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: shared
    env:
      KSDM_TAG: ${{ needs.check.outputs.tag }}
      KSDM_EXT_ZIP: ${{ needs.check.outputs.rehearsal == 'true' && 'ks-download-manager-dev' || 'ks-download-manager' }}-extension-v${{ needs.check.outputs.version }}.zip
      # The DEV build of the extension (extension/dev.json): its own ID, the DEV app's host.
      KSDM_EXT_BUILD: ${{ needs.check.outputs.rehearsal == 'true' && 'build:extension:dev' || 'build:extension' }}
      KSDM_EXT_ID: ${{ needs.check.outputs.rehearsal == 'true' && 'mhgmalnfheamcgcongjgdmepagonmmbc' || 'ikplfdbdfikcokpegkapjdedlgifmkbe' }}
      KSDM_EXT_KEY_FROM: ${{ needs.check.outputs.rehearsal == 'true' && 'extension/dev.json' || 'extension/manifest.json' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - run: node scripts/set-version.mjs "$KSDM_TAG"
      - run: npm ci
      - run: npm run "$KSDM_EXT_BUILD"
      - name: Zip (manifest.json at the top of the zip)
        run: |
          mkdir -p release
          # zip and unzip read options from these variables; none may change what is made.
          (cd extension/dist && env -u ZIP -u ZIPOPT zip -q -r -X "../../release/$KSDM_EXT_ZIP" .)
          [ -s "release/$KSDM_EXT_ZIP" ] || { echo "::error::release/$KSDM_EXT_ZIP was not made"; exit 1; }
          L=$(env -u UNZIP -u UNZIPOPT unzip -Z1 "release/$KSDM_EXT_ZIP")
          echo "$L"
          echo "$L" | grep -qx 'manifest.json' || { echo "::error::manifest.json is not at the top of the zip"; exit 1; }
          if echo "$L" | grep -qiE '\.zip$'; then echo "::error::the zip contains a zip (itself?)"; exit 1; fi
          if find extension/dist -iname '*.zip' | grep -q .; then echo "::error::a zip was written into extension/dist"; exit 1; fi
      - name: The zipped manifest gives our extension ID
        run: |
          D=$(mktemp -d)
          env -u UNZIP -u UNZIPOPT unzip -q "release/$KSDM_EXT_ZIP" manifest.json -d "$D"
          node scripts/extension-id.mjs "$D/manifest.json" "$KSDM_EXT_ID"
          node -e 'const a=require(process.argv[1]).key,b=require(process.argv[2]).key; if(a!==b){console.error("key differs from the repository file");process.exit(1)}' "$D/manifest.json" "$PWD/$KSDM_EXT_KEY_FROM"
          V=$(node -p 'require(process.argv[1]).version' "$D/manifest.json")
          [ "$V" = "${{ needs.check.outputs.version }}" ] || { echo "::error::zipped manifest version $V"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: shared/release/
          if-no-files-found: error

  # ffmpeg/ffprobe for Windows, cross-built on Linux (as in ci.yml).
  ffmpeg-windows:
    needs: check
    if: contains(fromJSON('["all","windows"]'), needs.check.outputs.platform)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cross-build (mingw-w64, nasm)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mingw-w64 nasm >/dev/null
          sh shared/scripts/build-ffmpeg.sh "$PWD/ffmpeg-work" windows-x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-windows
          path: ffmpeg-work/out-windows-x86_64/
          if-no-files-found: error

  # The Windows installer, beta: per-user NSIS, not code-signed (docs/release-plan.md, 3.2).
  windows:
    needs: [check, ffmpeg-windows]
    runs-on: windows-2025
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: shared
    env:
      KSDM_TAG: ${{ needs.check.outputs.tag }}
      KSDM_VERSION: ${{ needs.check.outputs.version }}
      KSDM_SETUP: ${{ needs.check.outputs.rehearsal == 'true' && 'ks-download-manager-dev' || 'ks-download-manager' }}-v${{ needs.check.outputs.version }}-windows-x64-setup-beta.exe
      KSDM_CONFIG: ${{ needs.check.outputs.rehearsal == 'true' && '--config src-tauri/tauri.dev.conf.json' || '' }}
      # The installer test checks the DEV identity in a DEV build.
      KSDM_DEV: ${{ needs.check.outputs.rehearsal == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - run: node scripts/set-version.mjs "$KSDM_TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-windows
          path: shared/ffmpeg-windows
      - run: npm ci
      - name: Bundled programs (hash-checked; ffmpeg from the cross build)
        run: node scripts/sidecars.mjs x86_64-pc-windows-msvc --ffmpeg-from ffmpeg-windows
      - name: Build the installer
        run: npm run tauri build -- --bundles nsis $KSDM_CONFIG
      - name: Name it
        run: |
          mkdir -p release
          set -- src-tauri/target/release/bundle/nsis/*-setup.exe
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "::error::expected one installer, found: $*"; exit 1; }
          cp "$1" "release/$KSDM_SETUP"
      - name: Install, check (files, licences, programs, Chrome registration), uninstall
        run: sh scripts/test-windows-installer.sh "release/$KSDM_SETUP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: shared/release/
          if-no-files-found: error

  # Attests exactly the planned files and publishes them as one release, or nothing. A job
  # this release does not need is skipped; a failed or cancelled one stops it.
  publish:
    needs: [check, plan, ffmpeg-source, mac, extension, ffmpeg-windows, windows]
    if: ${{ !cancelled() && needs.plan.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    uses: kumasumit/ks-utility/.github/workflows/tauri-app-release-publish.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      tag: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      platform: ${{ needs.check.outputs.platform }}
      rehearsal: ${{ needs.check.outputs.rehearsal }}
      files: ${{ needs.plan.outputs.files }}
      title: KS Download Manager ${{ needs.check.outputs.heading }}
      notes: node shared/scripts/release-notes.mjs "$KS_VERSION" "$KS_PLATFORM" artifacts ${{ needs.check.outputs.rehearsal == 'true' && '--dev' || '' }} > notes.md
