# Checks on every push and pull request, and on a manual run (Actions > CI > Run workflow).
# Release builds are in release.yml. The Windows installer and the unpacked extension built
# here are kept as workflow artifacts for 14 days, for hand testing (docs/testing.md).
# Runner images are named versions, never -latest (docs/decisions-release.md).
# Actions are GitHub's own, pinned to a full commit SHA (version in the comment).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    # The Tauri project lives in shared/ (CLAUDE.md, "Platform folders").
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shared/src-tauri/target
          key: rust-${{ runner.os }}-${{ matrix.triple }}-${{ hashFiles('rust-toolchain.toml', 'shared/src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ matrix.triple }}-
      - name: Cache bundled programs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: shared/src-tauri/binaries
          key: sidecars-${{ matrix.triple }}-${{ hashFiles('shared/src-tauri/sidecars.json', 'shared/scripts/build-ffmpeg.sh', 'shared/scripts/sidecars.mjs', 'shared/scripts/deno-notices.mjs') }}
      - run: npm ci
      - name: Bundled programs (hash-checked; ffmpeg built from source)
        run: node scripts/sidecars.mjs ${{ matrix.triple }}
      - run: npm run build
      - run: npm run test:lang
      - run: npm run test:ui
      - run: npm run test:extension
      - run: npm run build:extension
      # The unpacked extension, to load in Chrome for testing (not a release file).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-unpacked
          path: shared/extension/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Script tests
        run: node --test scripts/test/
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      # The DEV build (tauri.dev.conf.json turns on the `dev` feature): its own identity.
      - name: Rust tests and Clippy, DEV build
        run: |
          cargo test --locked --lib --features dev --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --all-targets --features dev --manifest-path src-tauri/Cargo.toml -- -D warnings

  # ffmpeg/ffprobe for Windows, cross-built on Linux (docs/release-plan.md, section 4.1).
  # Cached by the ffmpeg and zlib pins plus the build script, so a change to either rebuilds.
  ffmpeg-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache key
        id: key
        run: echo "key=ffmpeg-windows-x86_64-$( (jq -c '[.ffmpeg, .zlib]' shared/src-tauri/sidecars.json; cat shared/scripts/build-ffmpeg.sh) | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - name: Cache the build
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffmpeg-work/out-windows-x86_64
          key: ${{ steps.key.outputs.key }}
      - name: Cross-build (mingw-w64, nasm)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mingw-w64 nasm >/dev/null
          sh shared/scripts/build-ffmpeg.sh "$PWD/ffmpeg-work" windows-x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-windows
          path: ffmpeg-work/out-windows-x86_64/
          if-no-files-found: error

  # The same checks on Windows, plus the Windows-only tests (docs/release-plan.md, section 4).
  # A job of its own, not a matrix row: it needs the cross-built ffmpeg, and a Windows
  # failure must never hold up or change the macOS job.
  check-windows:
    needs: ffmpeg-windows
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
        working-directory: shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shared/src-tauri/target
          key: rust-${{ runner.os }}-x86_64-pc-windows-msvc-${{ hashFiles('rust-toolchain.toml', 'shared/src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-x86_64-pc-windows-msvc-
      - name: Cache bundled programs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: shared/src-tauri/binaries
          key: sidecars-x86_64-pc-windows-msvc-${{ hashFiles('shared/src-tauri/sidecars.json', 'shared/scripts/sidecars.mjs', 'shared/scripts/deno-notices.mjs') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-windows
          path: shared/ffmpeg-windows
      - run: npm ci
      - name: Bundled programs (hash-checked; ffmpeg from the cross build)
        run: node scripts/sidecars.mjs x86_64-pc-windows-msvc --ffmpeg-from ffmpeg-windows
      - name: Bundled programs run, and ffmpeg is LGPL only
        run: |
          B=src-tauri/binaries
          "$B/ffmpeg-x86_64-pc-windows-msvc.exe" -hide_banner -version | head -1
          "$B/ffprobe-x86_64-pc-windows-msvc.exe" -hide_banner -version | head -1
          if "$B/ffmpeg-x86_64-pc-windows-msvc.exe" -hide_banner -buildconf | grep -E -- '--enable-(gpl|nonfree)'; then
            echo "::error::ffmpeg was built with GPL or non-free parts"; exit 1
          fi
          "$B/deno-x86_64-pc-windows-msvc.exe" --version | head -1
          "$B/yt-dlp/yt-dlp.exe" --version
      - run: npm run build
      - run: npm run test:lang
      - run: npm run test:ui
      - run: npm run test:extension
      - run: npm run build:extension
      - name: Script tests
        run: node --test scripts/test/
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

  # The Windows installer, built and tested: silent install, the files, licences and
  # programs it put there, the Chrome host registration done by its hook, then silent
  # uninstall and what it removed (scripts/test-windows-installer.sh).
  installer-windows:
    needs: ffmpeg-windows
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
        working-directory: shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - name: Cache Rust release build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shared/src-tauri/target
          key: rust-release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'shared/src-tauri/Cargo.lock') }}
          restore-keys: rust-release-${{ runner.os }}-
      - name: Cache bundled programs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: shared/src-tauri/binaries
          key: sidecars-x86_64-pc-windows-msvc-${{ hashFiles('shared/src-tauri/sidecars.json', 'shared/scripts/sidecars.mjs', 'shared/scripts/deno-notices.mjs') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-windows
          path: shared/ffmpeg-windows
      - run: npm ci
      - run: node scripts/sidecars.mjs x86_64-pc-windows-msvc --ffmpeg-from ffmpeg-windows
      - name: Build the installer
        run: npm run tauri build -- --bundles nsis
      - name: Install, check, uninstall
        run: |
          set -- src-tauri/target/release/bundle/nsis/*-setup.exe
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "::error::expected one installer, found: $*"; exit 1; }
          sh scripts/test-windows-installer.sh "$1"
      # Unsigned test build for hand testing on Windows (not a release file).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-unsigned
          path: shared/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  bench:
    runs-on: macos-15
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shared/src-tauri/target
          key: bench-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'shared/src-tauri/Cargo.lock') }}
          restore-keys: bench-${{ runner.os }}-
      # The unthrottled floor is a machine-dependent sanity check: 500 MiB/s on the owner's
      # Mac (bench.rs default), 100 here, since shared runners have measured 187 to 627 MiB/s.
      # Only the floor is loosened; the speed-up, missing-count and one-connection checks are
      # unchanged (docs/decisions-release.md, docs/benchmarks.md).
      - name: Benchmark against the local throttled server (no internet download)
        env:
          KSDM_BENCH_FLOOR_MIBS: "100"
        run: |
          set +e
          npm run bench 2>&1 | tee bench.log
          status=${PIPESTATUS[0]}
          {
            echo "### Engine benchmark (macos-15, shared runner)"
            echo
            grep -E '^\|' bench.log
            echo
            echo "**$(grep -E '^unthrottled:' bench.log || echo 'unthrottled: not measured (the run stopped earlier)')**"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
