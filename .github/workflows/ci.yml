# Checks on every push and pull request. Release builds are in release.yml.
# Runner images are named versions, never -latest (docs/decisions-release.md).
# Actions are GitHub's own, pinned to a full commit SHA (version in the comment).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-${{ matrix.triple }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ matrix.triple }}-
      - name: Cache bundled programs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/binaries
          key: sidecars-${{ matrix.triple }}-${{ hashFiles('src-tauri/sidecars.json', 'scripts/build-ffmpeg.sh', 'scripts/sidecars.mjs', 'scripts/deno-notices.mjs') }}
      - run: npm ci
      - name: Bundled programs (hash-checked; ffmpeg built from source)
        run: node scripts/sidecars.mjs ${{ matrix.triple }}
      - run: npm run build
      - run: npm run test:lang
      - run: npm run test:ui
      - run: npm run test:extension
      - run: npm run build:extension
      - name: Script tests
        run: node --test scripts/test/
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

  # ffmpeg/ffprobe for Windows, cross-built on Linux (docs/release-plan.md, section 4.1).
  # Cached by the ffmpeg and zlib pins plus the build script, so a change to either rebuilds.
  ffmpeg-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache key
        id: key
        run: echo "key=ffmpeg-windows-x86_64-$( (jq -c '[.ffmpeg, .zlib]' src-tauri/sidecars.json; cat scripts/build-ffmpeg.sh) | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - name: Cache the build
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffmpeg-work/out-windows-x86_64
          key: ${{ steps.key.outputs.key }}
      - name: Cross-build (mingw-w64, nasm)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mingw-w64 nasm >/dev/null
          sh scripts/build-ffmpeg.sh "$PWD/ffmpeg-work" windows-x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-windows
          path: ffmpeg-work/out-windows-x86_64/
          if-no-files-found: error

  # The same checks on Windows, plus the Windows-only tests (docs/release-plan.md, section 4).
  # A job of its own, not a matrix row: it needs the cross-built ffmpeg, and a Windows
  # failure must never hold up or change the macOS job.
  check-windows:
    needs: ffmpeg-windows
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-x86_64-pc-windows-msvc-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-x86_64-pc-windows-msvc-
      - name: Cache bundled programs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/binaries
          key: sidecars-x86_64-pc-windows-msvc-${{ hashFiles('src-tauri/sidecars.json', 'scripts/sidecars.mjs', 'scripts/deno-notices.mjs') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-windows
          path: ffmpeg-windows
      - run: npm ci
      - name: Bundled programs (hash-checked; ffmpeg from the cross build)
        run: node scripts/sidecars.mjs x86_64-pc-windows-msvc --ffmpeg-from ffmpeg-windows
      - name: Bundled programs run, and ffmpeg is LGPL only
        run: |
          B=src-tauri/binaries
          "$B/ffmpeg-x86_64-pc-windows-msvc.exe" -hide_banner -version | head -1
          "$B/ffprobe-x86_64-pc-windows-msvc.exe" -hide_banner -version | head -1
          if "$B/ffmpeg-x86_64-pc-windows-msvc.exe" -hide_banner -buildconf | grep -E -- '--enable-(gpl|nonfree)'; then
            echo "::error::ffmpeg was built with GPL or non-free parts"; exit 1
          fi
          "$B/deno-x86_64-pc-windows-msvc.exe" --version | head -1
          "$B/yt-dlp/yt-dlp.exe" --version
      - run: npm run build
      - run: npm run test:lang
      - run: npm run test:ui
      - run: npm run test:extension
      - run: npm run build:extension
      - name: Script tests
        run: node --test scripts/test/
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

  bench:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: bench-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: bench-${{ runner.os }}-
      - name: Benchmark against the local throttled server (no internet download)
        run: npm run bench
