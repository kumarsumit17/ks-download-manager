<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The DEV build's icon: the app icon in orange, with a striped corner, so a DEV copy is
       never mistaken for the production app in the Dock, taskbar or browser. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0962e"/>
      <stop offset="1" stop-color="#b8560a"/>
    </linearGradient>
    <clipPath id="c"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#g)"/>
  <g clip-path="url(#c)">
    <path d="M660 64h300v300z" fill="#2b2b2b"/>
    <path d="M760 64h60l140 140v60z" fill="#ffd23f"/>
  </g>
  <path d="M512 232v400M352 482l160 160 160-160" fill="none" stroke="#fff" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M312 772h400" stroke="#fff" stroke-width="84" stroke-linecap="round"/>
</svg>
