[package]
name = "ks-download-manager"
# Placeholder. Release builds take the version from the git tag (see CLAUDE.md).
version = "0.0.0"
description = "KS Download Manager"
authors = ["Kumar Sumit"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows issue,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "ks_download_manager_lib"
crate-type = ["rlib"]

[workspace]
members = ["engine"]
# Plain `cargo test` / `cargo clippy` in src-tauri/ also cover the engine crate.
default-members = [".", "engine"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
engine = { path = "engine" }
# First-party shared utilities (KS-Suite), pinned to one commit; see CLAUDE.md.
ks-utility = { git = "https://github.com/kumarsumit17/ks-utility", tag = "v0.2.2" }
# Already in Cargo.lock through tauri and the engine: no new packages.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# process: runs the bundled yt-dlp; io-util/macros: reads its output, stops it on pause;
# net: the Unix socket the Chrome extension's native host talks to.
tokio = { version = "1.54.1", features = ["time", "process", "io-util", "macros", "rt", "net"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["time", "rt", "macros", "fs"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
