[package]
name = "ks-download-manager"
# Placeholder. Release builds take the version from the git tag (see CLAUDE.md).
version = "0.0.0"
description = "KS Download Manager"
authors = ["Kumar Sumit"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows issue,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "ks_download_manager_lib"
crate-type = ["rlib"]

[workspace]
# engine: the download engine. desktop/mac and desktop/windows: each OS's own code (empty on
# the other system), so they share this lock file.
members = ["engine", "../../desktop/mac", "../../desktop/windows"]
# Plain `cargo test` / `cargo clippy` in src-tauri/ also cover the engine and the platform crates.
default-members = [".", "engine", "../../desktop/mac", "../../desktop/windows"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
engine = { path = "engine" }
# First-party shared utilities (KS-Suite), pinned to one commit; see CLAUDE.md.
ks-utility = { git = "https://github.com/kumasumit/ks-utility", tag = "v0.16.0" }
# Already in Cargo.lock through tauri and the engine: no new packages.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# process: runs the bundled yt-dlp; io-util/macros: reads its output, stops it on pause;
# net: the Unix socket (macOS) or named pipe (Windows) the Chrome extension's native host talks to; sync: the limit on
# thumbnail fetches at once.
tokio = { version = "1.54.1", features = ["time", "process", "io-util", "macros", "rt", "net", "sync"] }
# Notifications when a download finishes or fails (approved by the owner, specs/plan-per-platform.md, 3.2).
# On macOS it uses mac-notification-sys, on Windows tauri-winrt-notification; its Linux backend
# (zbus, notify-rust) is in Cargo.lock but never built for our targets.
tauri-plugin-notification = "2.8.1"

# The per-platform code (src/os.rs, specs/plan-per-platform.md).
[target.'cfg(target_os = "macos")'.dependencies]
ksdm-mac = { path = "../../desktop/mac" }

# Windows only: the per-platform code, and who is at the other end of the extension's named pipe (the user SID of the
# process, src/handoff.rs), the process-creation flags, and Windows constants. Already in
# Cargo.lock through tokio and Tauri: no new package. Approved by the owner (docs/release-plan.md, 8).
[target.'cfg(windows)'.dependencies]
ksdm-windows = { path = "../../desktop/windows" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["time", "rt", "macros", "fs"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
