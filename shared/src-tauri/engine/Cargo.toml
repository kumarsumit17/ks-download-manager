[package]
name = "engine"
version = "0.0.0"
description = "KS Download Manager download engine (no Tauri dependency)"
license = "MIT"
edition = "2024"
publish = false

[dependencies]
# First-party shared utilities (KS-Suite), the same commit as in src-tauri/Cargo.toml.
ks-utility = { git = "https://github.com/kumarsumit17/ks-utility", tag = "v0.9.0" }
# HTTP/1.1 only (no http2 feature), rustls TLS, no decompression features:
# byte offsets must match the file exactly.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["fs", "io-util", "rt", "rt-multi-thread", "sync", "time", "macros", "net"] }

[lints.rust]
unsafe_code = "forbid"
