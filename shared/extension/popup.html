<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1 data-i18n="extName"></h1>
    <p id="status" role="status"></p>
    <section id="update" hidden>
      <p id="update-text"></p>
      <button type="button" id="update-button" data-i18n="updateButton"></button>
    </section>
    <section id="site"></section>
    <section>
      <label class="row">
        <input type="checkbox" id="downloads" />
        <span data-i18n="downloadsToggle"></span>
      </label>
      <p class="note" data-i18n="downloadsNote"></p>
      <p class="note" id="last" role="status"></p>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
